name: KOTRA Diagnose (temporary)

# KOTRA가 GitHub Actions에서만 timeout으로 실패하는 원인을 러너에서 직접
# 확인하기 위한 임시 워크플로. 원인 확인 후 삭제한다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Runner egress IP
        run: curl -s --max-time 20 https://api.ipify.org || echo "(IP 확인 실패)"

      - name: DNS / TCP / TLS reachability
        run: |
          echo "--- DNS ---"; getent hosts www.kotra.or.kr || echo "DNS 실패"
          echo "--- TCP 443 ---"; timeout 20 bash -c 'cat < /dev/null > /dev/tcp/www.kotra.or.kr/443' && echo "TCP 연결 OK" || echo "TCP 연결 실패"
          echo "--- curl 홈페이지(HEAD) ---"
          curl -s -o /dev/null -w "http=%{http_code} time=%{time_total}s\n" --max-time 30 -I https://www.kotra.or.kr/ || echo "curl 실패"

      - name: Python header/method matrix test
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error

          URL = "https://www.kotra.or.kr/module/subhome/bizAply/selectBmBizRcritYListNewAjax.do"
          BODY = "startCount=0&pageSize=20&schApplYn=N"
          BOT_UA = "Mozilla/5.0 (compatible; g2b-alert-bot/1.0)"
          BROWSER_UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                        "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36")

          CASES = [
            ("현재 코드 그대로(POST, bot UA)", "POST", {
              "User-Agent": BOT_UA,
              "Content-Type": "application/x-www-form-urlencoded"}),
            ("POST + 브라우저 UA만", "POST", {
              "User-Agent": BROWSER_UA,
              "Content-Type": "application/x-www-form-urlencoded"}),
            ("POST + 브라우저 UA + Accept/Lang", "POST", {
              "User-Agent": BROWSER_UA,
              "Content-Type": "application/x-www-form-urlencoded",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "ko-KR,ko;q=0.9,en-US;q=0.8,en;q=0.7"}),
            ("POST + 전체 브라우저 헤더 + Referer + XHR", "POST", {
              "User-Agent": BROWSER_UA,
              "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
              "Accept": "text/html,*/*;q=0.8",
              "Accept-Language": "ko-KR,ko;q=0.9,en;q=0.8",
              "Referer": "https://www.kotra.or.kr/subList/20000020753/subhome/bizAply/selectBizMntInfoList.do",
              "Origin": "https://www.kotra.or.kr",
              "X-Requested-With": "XMLHttpRequest",
              "Connection": "keep-alive"}),
            ("GET(본문 없이) + 브라우저 헤더", "GET", {
              "User-Agent": BROWSER_UA,
              "Accept": "text/html,*/*;q=0.8",
              "Accept-Language": "ko-KR,ko;q=0.9"}),
          ]

          for name, method, headers in CASES:
              data = BODY.encode() if method == "POST" else None
              url = URL if method == "POST" else URL + "?" + BODY
              start = time.time()
              try:
                  req = urllib.request.Request(url, data=data, headers=headers, method=method)
                  with urllib.request.urlopen(req, timeout=40) as res:
                      body = res.read()
                  print(f"[OK]   {name}: HTTP {res.status}, {len(body)} bytes, {time.time()-start:.1f}s")
              except urllib.error.HTTPError as e:
                  print(f"[HTTP] {name}: HTTP {e.code}, {time.time()-start:.1f}s")
              except Exception as e:
                  print(f"[FAIL] {name}: {type(e).__name__} {str(e)[:80]}, {time.time()-start:.1f}s")
              time.sleep(2)

          print("--- KOTRA 공개 목록 페이지(HTML, 비-AJAX) 접근 테스트 ---")
          page = "https://www.kotra.or.kr/subList/20000020753/subhome/bizAply/selectBizMntInfoList.do"
          start = time.time()
          try:
              req = urllib.request.Request(page, headers={"User-Agent": BROWSER_UA})
              with urllib.request.urlopen(req, timeout=40) as res:
                  body = res.read()
              print(f"[OK]   공개 목록 페이지: HTTP {res.status}, {len(body)} bytes, {time.time()-start:.1f}s")
          except Exception as e:
              print(f"[FAIL] 공개 목록 페이지: {type(e).__name__} {str(e)[:80]}, {time.time()-start:.1f}s")
          PY
