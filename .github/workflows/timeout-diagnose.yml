name: DGIST/KAIST Timeout Diagnose (temporary)

# DGIST/KAIST가 Actions에서 간헐적으로 timeout 나는 원인을 실측한다.
# 추측으로 재시도 값을 바꾸기 전에, 단계별(DNS/TCP/TLS/첫 응답) 소요 시간과
# 반복 호출 시 패턴(일시 제한 여부)을 확인하는 것이 목적. 확인 후 삭제한다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Runner egress IP
        run: curl -s --max-time 20 https://api.ipify.org || echo "(IP 확인 실패)"

      - name: Stage timings (curl)
        run: |
          for u in \
            "https://www.dgist.ac.kr/prog/bidPbanc/kor/sub06_01_04/list.do?pageIndex=1" \
            "https://www.kaist.ac.kr/kr/html/footer/0815.html"; do
            echo "=== $u"
            for i in 1 2 3; do
              curl -s -o /dev/null --max-time 40 \
                -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36" \
                -w "  시도$i http=%{http_code} dns=%{time_namelookup}s tcp=%{time_connect}s tls=%{time_appconnect}s 첫응답=%{time_starttransfer}s 총=%{time_total}s\n" \
                "$u" || echo "  시도$i 실패(curl exit $?)"
              sleep 5
            done
          done

      - name: Python timeout/UA matrix
        run: |
          python - <<'PY'
          import socket, ssl, time, urllib.request, urllib.error

          BOT = "Mozilla/5.0 (compatible; g2b-alert-bot/1.0)"
          BROWSER = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                     "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36")
          TARGETS = {
            "DGIST": ("www.dgist.ac.kr",
                      "https://www.dgist.ac.kr/prog/bidPbanc/kor/sub06_01_04/list.do?pageIndex=1"),
            "KAIST": ("www.kaist.ac.kr",
                      "https://www.kaist.ac.kr/kr/html/footer/0815.html"),
          }

          def tcp_probe(host):
              start = time.time()
              try:
                  s = socket.create_connection((host, 443), timeout=15)
                  s.close()
                  return f"TCP OK {time.time()-start:.2f}s"
              except Exception as e:
                  return f"TCP 실패 {type(e).__name__} {str(e)[:50]} ({time.time()-start:.2f}s)"

          def http_probe(url, ua, timeout):
              start = time.time()
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": ua})
                  with urllib.request.urlopen(req, timeout=timeout) as res:
                      n = len(res.read())
                  return f"OK HTTP {res.status} {n}B {time.time()-start:.2f}s"
              except Exception as e:
                  return f"실패 {type(e).__name__} {str(e)[:45]} ({time.time()-start:.2f}s)"

          for name, (host, url) in TARGETS.items():
              print(f"=== {name} ===")
              print(f"  DNS/{host}: ", end="")
              try:
                  print(socket.gethostbyname(host))
              except Exception as e:
                  print(f"실패 {e}")
              print(f"  {tcp_probe(host)}")
              print(f"  bot UA   / timeout 25s : {http_probe(url, BOT, 25)}")
              time.sleep(4)
              print(f"  브라우저 UA / timeout 25s : {http_probe(url, BROWSER, 25)}")
              time.sleep(4)
              print(f"  브라우저 UA / timeout 60s : {http_probe(url, BROWSER, 60)}")
              print()

          print("=== 연속 호출 패턴 (간격 2초 x 5회) — 일시 제한 여부 확인 ===")
          for name, (host, url) in TARGETS.items():
              results = []
              for i in range(5):
                  results.append(http_probe(url, BROWSER, 25).split()[0])
                  time.sleep(2)
              print(f"  {name}: {results}")

          print()
          print("=== 간격 15초 x 3회 — 간격을 벌리면 달라지는지 ===")
          for name, (host, url) in TARGETS.items():
              results = []
              for i in range(3):
                  results.append(http_probe(url, BROWSER, 25).split()[0])
                  if i < 2:
                      time.sleep(15)
              print(f"  {name}: {results}")
          PY
