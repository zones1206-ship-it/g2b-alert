name: Fetch Project Radar Announcements

on:
  schedule:
    - cron: "0 22 * * *"  # 매일 07:00 KST (UTC 22:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 제목 번역용 Argos 모델을 캐시해 매 실행마다 다시 받지 않는다.
      #   en→ko (약 130MB) : JETRO 영문 제목
      #   zh→en (약 83MB)  : EBNEW 중국어 제목(한국어 직접 모델이 없어 영어 경유)
      # 모델 파일은 저장소에 커밋하지 않는다.
      # 캐시가 없거나 복원에 실패해도 아래 설치 스크립트가 조용히 처리하고,
      # 그마저 실패하면 수집기가 기존 용어집 방식으로 폴백한다.
      # v4는 Node 20 런타임이라 지원 종료 경고가 뜬다. v5부터 Node 24를 쓰며
      # Actions Runner 2.327.1 이상을 요구하는데, 이 저장소가 쓰는 GitHub
      # 호스티드 러너는 2.337.0이라 조건을 충족한다(실행 로그로 확인).
      - name: Restore Argos translation model cache
        id: argos-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/argos-translate/packages
          key: argos-models-en-ko-zh-en-v1

      - name: Ensure Argos translation models
        continue-on-error: true
        run: python scripts/install_translation_model.py

      # 핵심 규칙 회귀테스트(네트워크 재시도/FetchState/장비 판정/Telegram
      # 중복 방지). 실제 네트워크나 번역 모델을 쓰지 않아 1초 안에 끝난다.
      # 여기서 실패하면 수집을 진행하지 않는다 — 잘못된 분류나 중복 알림이
      # 담긴 데이터를 커밋하는 것보다 그날 갱신을 건너뛰는 편이 안전하다
      # (기존 데이터는 그대로 남고, Actions 실패로 즉시 눈에 띈다).
      - name: 핵심 규칙 회귀테스트
        run: python -m unittest discover -s tests

      - name: Snapshot previous data (신규 공고 판별용)
        run: cp data/announcements.json data/announcements.before.json

      - name: Fetch announcements
        run: python scripts/fetch_announcements.py

      - name: Notify new announcements via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py data/announcements.before.json data/announcements.json

      # 신규 공고 알림과는 별개 기능이다. 수집원이 연속 3회 이상 실패하면
      # 최초 1회만 장애를 알리고, 정상 복귀하면 복구를 알린다(중복 발송 방지
      # 상태는 announcements.json의 sourceHealth에 저장돼 아래 커밋 스텝이
      # 함께 저장한다).
      - name: Notify source collection failures via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_source_health.py data/announcements.json

      - name: Commit updated data
        run: |
          rm -f data/announcements.before.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # translation_memory.json: 검증을 통과한 번역을 원문 기준으로 기억해
          # 같은 원문이 실행마다 다른 한국어로 바뀌는 것을 막는다(수 KB 텍스트).
          git add data/announcements.json data/translation_memory.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: update announcements data"
          # 수집이 도는 동안 사람이 main에 푸시하면 push가 (fetch first)로 거부돼
          # 수집 결과가 통째로 버려진다(실제로 발생). 데이터 파일은 이 워크플로만
          # 건드리므로 rebase로 올려붙이고 재시도한다. 무한 재시도는 하지 않는다.
          for attempt in 1 2 3; do
            if git push; then
              echo "push 성공 (시도 $attempt)"
              exit 0
            fi
            echo "push 거부됨 — 원격 변경을 rebase 후 재시도 ($attempt/3)"
            git pull --rebase origin main || exit 1
          done
          echo "3회 시도 후에도 push 실패"
          exit 1
