name: Fetch Project Radar Announcements

on:
  schedule:
    - cron: "0 22 * * *"  # 매일 07:00 KST (UTC 22:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # JETRO 영문 제목 번역용 en→ko 모델(약 130MB)을 캐시해 매 실행마다
      # 다시 받지 않는다. 모델 파일은 저장소에 커밋하지 않는다.
      # 캐시가 없거나 복원에 실패해도 아래 설치 스크립트가 조용히 처리하고,
      # 그마저 실패하면 수집기가 기존 용어집 방식으로 폴백한다.
      - name: Restore Argos en→ko model cache
        id: argos-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate/packages
          key: argos-en-ko-v1

      - name: Ensure Argos en→ko model
        continue-on-error: true
        run: python scripts/install_translation_model.py

      - name: Snapshot previous data (신규 공고 판별용)
        run: cp data/announcements.json data/announcements.before.json

      - name: Fetch announcements
        run: python scripts/fetch_announcements.py

      - name: Notify new announcements via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py data/announcements.before.json data/announcements.json

      # 신규 공고 알림과는 별개 기능이다. 수집원이 연속 3회 이상 실패하면
      # 최초 1회만 장애를 알리고, 정상 복귀하면 복구를 알린다(중복 발송 방지
      # 상태는 announcements.json의 sourceHealth에 저장돼 아래 커밋 스텝이
      # 함께 저장한다).
      - name: Notify source collection failures via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_source_health.py data/announcements.json

      - name: Commit updated data
        run: |
          rm -f data/announcements.before.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/announcements.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: update announcements data"
          # 수집이 도는 동안 사람이 main에 푸시하면 push가 (fetch first)로 거부돼
          # 수집 결과가 통째로 버려진다(실제로 발생). 데이터 파일은 이 워크플로만
          # 건드리므로 rebase로 올려붙이고 재시도한다. 무한 재시도는 하지 않는다.
          for attempt in 1 2 3; do
            if git push; then
              echo "push 성공 (시도 $attempt)"
              exit 0
            fi
            echo "push 거부됨 — 원격 변경을 rebase 후 재시도 ($attempt/3)"
            git pull --rebase origin main || exit 1
          done
          echo "3회 시도 후에도 push 실패"
          exit 1
