name: New Source Reachability Check (temporary)

# 1차 확인에서 나온 실패 3건(JETRO 403 / MIMOS 인증서 / DGIST·KAIST 연결)의
# 실제 원인을 좁히기 위한 2차 진단. 확인 후 삭제한다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Runner egress IP
        run: curl -s --max-time 20 https://api.ipify.org || echo "(IP 확인 실패)"

      - name: Detailed diagnosis
        run: |
          python - <<'PY'
          import ssl, time, urllib.request, urllib.error

          BOT = "Mozilla/5.0 (compatible; g2b-alert-bot/1.0)"
          BROWSER = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                     "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36")
          JETRO_API = "https://www.jetro.go.jp/view_interface.php?blockId=27911119&keyword=semiconductor&deadline=00"

          def probe(name, url, headers=None, ctx=None, timeout=30):
              start = time.time()
              try:
                  req = urllib.request.Request(url, headers=headers or {"User-Agent": BOT})
                  with urllib.request.urlopen(req, timeout=timeout, context=ctx) as res:
                      body = res.read()
                  print(f"[OK]   {name}: HTTP {res.status}, {len(body)} bytes, {time.time()-start:.1f}s")
                  return True
              except urllib.error.HTTPError as e:
                  print(f"[HTTP] {name}: HTTP {e.code}, {time.time()-start:.1f}s")
              except Exception as e:
                  print(f"[FAIL] {name}: {type(e).__name__} {str(e)[:95]}, {time.time()-start:.1f}s")
              return False

          print("=== JETRO 403 원인 좁히기 ===")
          probe("JETRO API + bot UA", JETRO_API)
          probe("JETRO API + 브라우저 UA", JETRO_API, {"User-Agent": BROWSER})
          probe("JETRO API + 브라우저 UA + Referer", JETRO_API, {
              "User-Agent": BROWSER,
              "Referer": "https://www.jetro.go.jp/en/database/procurement/national/list.html",
              "Accept": "application/json, text/javascript, */*; q=0.01",
              "X-Requested-With": "XMLHttpRequest",
              "Accept-Language": "en-US,en;q=0.9"})

          print()
          print("=== MIMOS 인증서 문제 확인 ===")
          probe("MIMOS 기본 검증", "https://www.mimos.my/")
          try:
              import certifi
              ctx = ssl.create_default_context(cafile=certifi.where())
              probe("MIMOS certifi 번들", "https://www.mimos.my/", ctx=ctx)
          except ImportError:
              print("(certifi 미설치 — pip install 후 재확인 필요)")

          print()
          print("=== DGIST / KAIST 재확인 (일시 오류인지 상시 차단인지) ===")
          for i in (1, 2):
              probe(f"DGIST 시도{i}", "https://www.dgist.ac.kr/", {"User-Agent": BROWSER}, timeout=25)
              probe(f"KAIST 시도{i}", "https://www.kaist.ac.kr/", {"User-Agent": BROWSER}, timeout=25)
              time.sleep(3)
          PY

      - name: Install certifi and retry MIMOS
        run: |
          pip install --quiet certifi
          python - <<'PY'
          import ssl, certifi, urllib.request, urllib.error, time
          ctx = ssl.create_default_context(cafile=certifi.where())
          start = time.time()
          try:
              req = urllib.request.Request("https://www.mimos.my/", headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30, context=ctx) as res:
                  print(f"[OK]   MIMOS + certifi: HTTP {res.status}, {len(res.read())} bytes, {time.time()-start:.1f}s")
          except Exception as e:
              print(f"[FAIL] MIMOS + certifi: {type(e).__name__} {str(e)[:95]}")
          PY
