name: New Source Reachability Check (temporary)

# 3차: 신규 수집원 최종 판단용. KAIST가 상시 차단인지(앞서 3초 간격 2회
# 모두 timeout) 시간 간격을 두고 재확인하고, 실제 수집기가 쓰는 엔드포인트
# (JETRO 목록 JSON / ITRI 목록 / DGIST 목록)가 러너에서 동작하는지 본다.
# 확인 후 삭제한다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Runner egress IP
        run: curl -s --max-time 20 https://api.ipify.org || echo "(IP 확인 실패)"

      - name: Collector endpoints + KAIST re-check
        run: |
          python - <<'PY'
          import time, urllib.request, urllib.error

          BOT = "Mozilla/5.0 (compatible; g2b-alert-bot/1.0)"
          BROWSER = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                     "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36")

          def probe(name, url, headers=None, timeout=30):
              start = time.time()
              try:
                  req = urllib.request.Request(url, headers=headers or {"User-Agent": BOT})
                  with urllib.request.urlopen(req, timeout=timeout) as res:
                      body = res.read()
                  print(f"[OK]   {name}: HTTP {res.status}, {len(body)} bytes, {time.time()-start:.1f}s")
                  return True
              except urllib.error.HTTPError as e:
                  print(f"[HTTP] {name}: HTTP {e.code}, {time.time()-start:.1f}s")
              except Exception as e:
                  print(f"[FAIL] {name}: {type(e).__name__} {str(e)[:95]}, {time.time()-start:.1f}s")
              return False

          print("=== 실제 수집기가 쓰는 엔드포인트 ===")
          probe("JETRO 목록 JSON(Referer 포함)",
                "https://www.jetro.go.jp/view_interface.php?blockId=27911119&keyword=semiconductor&deadline=01",
                {"User-Agent": BROWSER,
                 "Referer": "https://www.jetro.go.jp/en/database/procurement/national/list.html",
                 "Accept": "application/json, text/javascript, */*; q=0.01",
                 "X-Requested-With": "XMLHttpRequest"})
          probe("ITRI 詢價案 목록", "https://quotaweb.itri.org.tw/quotabrowse.aspx")
          probe("DGIST 입찰정보 목록",
                "https://www.dgist.ac.kr/prog/bidPbanc/kor/sub06_01_04/list.do?pageIndex=1")

          print()
          print("=== KAIST 상시 차단 여부 재확인 (간격을 두고 3회) ===")
          for i in (1, 2, 3):
              probe(f"KAIST 입찰/구매 게시판 시도{i}",
                    "https://www.kaist.ac.kr/kr/html/footer/0815.html",
                    {"User-Agent": BROWSER}, timeout=25)
              if i < 3:
                  time.sleep(20)
          PY
