name: New Source Reachability Check (temporary)

# 신규 수집원 후보 6곳이 GitHub Actions 러너에서 실제로 접근 가능한지
# 확인하기 위한 임시 워크플로. KOTRA처럼 로컬에서는 되고 Actions에서는
# 차단되는 경우를 수집기 구현 전에 걸러내기 위함. 확인 후 삭제한다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Runner egress IP
        run: curl -s --max-time 20 https://api.ipify.org || echo "(IP 확인 실패)"

      - name: Reachability matrix
        run: |
          python - <<'PY'
          import time, urllib.request, urllib.error

          UA = "Mozilla/5.0 (compatible; g2b-alert-bot/1.0)"
          TARGETS = [
            ("JETRO 목록 JSON", "https://www.jetro.go.jp/view_interface.php?blockId=27911119&keyword=semiconductor&deadline=00"),
            ("JETRO 상세", "https://www.jetro.go.jp/en/database/procurement/national/articles/402008/2026090200110001.html"),
            ("ITRI 홈", "https://www.itri.org.tw/english/"),
            ("대만 정부전자조달망", "https://web.pcc.gov.tw/prkms/tender/common/basic/readTenderBasic"),
            ("MIMOS 홈", "https://www.mimos.my/"),
            ("GeBIZ 홈", "https://www.gebiz.gov.sg/"),
            ("GeBIZ 공고목록", "https://www.gebiz.gov.sg/ptn/opportunity/BOListing.xhtml"),
            ("DGIST 홈", "https://www.dgist.ac.kr/"),
            ("KAIST 홈", "https://www.kaist.ac.kr/"),
          ]

          for name, url in TARGETS:
              start = time.time()
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA})
                  with urllib.request.urlopen(req, timeout=30) as res:
                      body = res.read()
                  print(f"[OK]   {name}: HTTP {res.status}, {len(body)} bytes, {time.time()-start:.1f}s")
              except urllib.error.HTTPError as e:
                  print(f"[HTTP] {name}: HTTP {e.code}, {time.time()-start:.1f}s")
              except Exception as e:
                  print(f"[FAIL] {name}: {type(e).__name__} {str(e)[:90]}, {time.time()-start:.1f}s")
              time.sleep(1)
          PY
